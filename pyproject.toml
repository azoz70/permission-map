[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-map"
version = "0.3.0"
description = "PERMISSION MAP — local-first access intelligence & review engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abdulaziz Alshehri", email = "49665505+azoz70@users.noreply.github.com" }]
keywords = [
    "iam",
    "rbac",
    "access-review",
    "access-governance",
    "security",
    "permissions",
    "audit",
    "least-privilege",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pandas>=2.2",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "resvg-py>=0.5",
]

[project.scripts]
permission-map = "permission_map.cli.commands:app"

[project.urls]
Homepage = "https://github.com/azoz70/permission-map"
Documentation = "https://github.com/azoz70/permission-map#readme"
Issues = "https://github.com/azoz70/permission-map/issues"
LinkedIn = "https://www.linkedin.com/in/abdulaziz-alshehri/"

[tool.setuptools.packages.find]
where = ["."]
include = ["permission_map*"]

[tool.setuptools.package-data]
"permission_map.web" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["permission_map", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["permission_map"]
